<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freebuff Focus Mode</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#D8E2D5" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7" stroke-dasharray="38 6" transform="rotate(-45 12 12)" /><circle cx="12" cy="12" r="2.2" fill="#E8B34B" stroke="none" /></svg>
      </div>
      <div class="titles">
        <h1>Freebuff Focus Mode</h1>
        <p class="scope">freebuff.com only</p>
      </div>
    </header>

    <section class="row">
      <div class="labels">
        <span class="label">Focus</span>
        <span class="hint" id="stateText">Focusing</span>
      </div>
      <button
        id="toggle"
        class="switch"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Focus mode for freebuff.com"
      >
        <span class="knob"></span>
      </button>
    </section>

    <section class="timer">
      <div class="timer-head">
        <span class="label">For</span>
        <span class="hint" id="timerNote">Next session</span>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Focus length">
        <button class="chip" type="button" data-minutes="15" aria-pressed="false">15m</button>
        <button class="chip" type="button" data-minutes="25" aria-pressed="true">25m</button>
        <button class="chip" type="button" data-minutes="45" aria-pressed="false">45m</button>
        <button class="chip" type="button" data-minutes="0" aria-pressed="false">Until off</button>
      </div>
    </section>

    <section class="stats">
      <span class="count" id="count">0</span>
      <span class="caption">elements quieted on this tab</span>
    </section>

    <section class="pick">
      <button id="pick" class="pick-btn" type="button">Hide an element in focus</button>
      <div class="pick-meta">
        <span id="customCount">No custom rules</span>
        <span class="pick-meta-end">
          <kbd class="kbd" id="pickKey" hidden></kbd>
          <button id="clearCustom" class="link-btn" type="button" hidden>Clear</button>
        </span>
      </div>
    </section>

    <footer class="foot">
      <p class="status" id="statusText">Checking this tab…</p>
      <a id="installLink" href="#" target="_blank" rel="noreferrer">Install page &amp; docs</a>
      <span class="version" id="version"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
